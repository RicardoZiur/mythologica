<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mythologica — Panel de pagos</title>
<script>(function(){ if(localStorage.getItem('mythologica_tema')==='claro') document.documentElement.setAttribute('data-theme','claro'); })();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-wrap">
    <header class="admin-header">
      <a class="brand" href="../index.html">MYTHOLOGICA <span>PANEL DE PAGOS</span></a>
      <div class="admin-header-right">
        <button class="auth-link" id="btnTema" type="button">☀ Modo claro</button>
        <div id="authStatus" class="auth-status"></div>
      </div>
    </header>

    <div id="adminNav"></div>

    <div id="adminContenido">
      <p class="admin-cargando">Cargando...</p>
    </div>
  </div>

  <!-- Modal de login (por si alguien llega sin sesion) -->
  <div class="auth-modal-backdrop" id="authBackdrop">
    <div class="auth-modal">
      <button class="auth-close" id="authClose" aria-label="Cerrar">×</button>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" type="button">Iniciar sesión</button>
        <button class="auth-tab" id="tabRegistro" type="button">Crear cuenta</button>
      </div>
      <form id="formLogin" class="auth-form">
        <label>Email<input type="email" name="email" required></label>
        <label>Contraseña<input type="password" name="password" required></label>
        <p class="auth-error" id="loginError"></p>
        <button type="submit" class="auth-submit">Entrar</button>
      </form>
      <form id="formRegistro" class="auth-form" hidden>
        <label>Nombre<input type="text" name="nombre" required></label>
        <label>Email<input type="email" name="email" required></label>
        <label>Contraseña<input type="password" name="password" required minlength="8"></label>
        <p class="auth-error" id="registroError"></p>
        <button type="submit" class="auth-submit">Crear cuenta</button>
      </form>
    </div>
  </div>

  <script src="../js/tema.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-comun.js"></script>
  <script src="../js/admin-pagos.js"></script>
</body>
</html>
